name: Validate responsive administration
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
        working-directory: app
      - run: npm audit --audit-level=high
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-review
          path: app/package-lock.json
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: dotnet test api/Tests/Tests.csproj --configuration Release --logger trx
      - run: dotnet build api/WebAPI/WebAPI.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
  processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r processor/requirements.txt
      - run: python -m unittest -v test_processor
        working-directory: processor
  integration:
    needs: [app, api, processor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/init.mjs
      - run: docker compose up -d --build api app gateway
      - run: node scripts/smoke.mjs
      - run: docker compose logs --no-color api app mongo-init
        if: failure()
      - run: docker compose down -v
        if: always()
